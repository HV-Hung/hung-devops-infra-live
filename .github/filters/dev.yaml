# =============================================================================
# DEV ENVIRONMENT: Path Filters for Change Detection
# Order matters! Paths are executed top-to-bottom with max-parallel: 1.
# List dependencies first (e.g., resource-group before network before aks).
# =============================================================================

resource-group:
  - 'dev/resource-group/**'
  - 'dev/env.hcl'
  - '_envcommon/resource-group.hcl'
  - 'modules/resource-group/**'
  - 'root.hcl'
