# ==============================================================================
# APPLY: PROD ENVIRONMENT (with Approval Gate)
# Triggered on push to main (after PR merge) that changes prod/, shared, or
# module files. Plans, stores artifacts, waits for approval, then applies.
#
# PREREQUISITE: Create a GitHub Environment named "production" with required
# reviewers in: Settings → Environments → New environment → production
# ==============================================================================

name: "Apply: Prod"

on:
  push:
    branches: [main]
    paths:
      - 'prod/**'
      - '_envcommon/**'
      - 'modules/**'
      - 'root.hcl'

permissions:
  id-token: write
  contents: read

concurrency:
  group: terragrunt-apply-prod
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      paths: ${{ steps.filter.outputs.changes }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: '.github/filters/prod.yaml'
      - id: check
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          if [ "$CHANGES" = "[]" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  plan:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJson(needs.detect-changes.outputs.paths) }}
      fail-fast: false
      max-parallel: 1
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-terragrunt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terragrunt Plan
        working-directory: prod/${{ matrix.path }}
        run: |
          terragrunt plan -out=tfplan -no-color 2>&1 | tee plan_output.txt
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod-${{ matrix.path }}
          path: |
            prod/${{ matrix.path }}/.terragrunt-cache/**/tfplan
            prod/${{ matrix.path }}/plan_output.txt
          retention-days: 1

  approve:
    needs: plan
    runs-on: ubuntu-latest
    environment:
      name: production
    timeout-minutes: 60
    steps:
      - run: echo "✅ Production deployment approved"

  apply:
    needs: [detect-changes, plan, approve]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        path: ${{ fromJson(needs.detect-changes.outputs.paths) }}
      max-parallel: 1
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-terragrunt

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod-${{ matrix.path }}
          path: prod/${{ matrix.path }}

      - name: Terragrunt Apply Saved Plan
        working-directory: prod/${{ matrix.path }}
        run: |
          # Find the saved plan file in terragrunt cache
          PLAN_FILE=$(find .terragrunt-cache -name "tfplan" -type f | head -1)
          if [ -z "$PLAN_FILE" ]; then
            echo "❌ No saved plan found. Re-running plan + apply."
            terragrunt apply -auto-approve -no-color
          else
            echo "📋 Applying saved plan: $PLAN_FILE"
            cd $(dirname "$PLAN_FILE")
            terraform apply -no-color "$PLAN_FILE"
          fi
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
